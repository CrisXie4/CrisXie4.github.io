<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>数据看板 | 六哥</title>
<link rel="icon" href="/img/avatar-256.png">
<link rel="stylesheet" href="/admin/admin.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.kpi .n{font-size:28px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.kpi:nth-child(2) .n{color:var(--brown)}
.kpi:nth-child(3) .n{color:#B58B45}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.kpi .d{font-size:11px;color:var(--faint);margin-top:2px}
.range{display:inline-flex;border:1px solid #DDD5CC;border-radius:var(--r-md);overflow:hidden;background:#fff}
.range button{border:none;background:transparent;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.range button.on{background:var(--red);color:#fff}
.sect{margin-top:22px}
.sect .desc{font-size:12px;color:var(--faint);margin:-8px 0 10px}
#chart svg{width:100%;display:block}
.legend{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--red);vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.v2{border-top:2px dashed var(--brown)}
#filter{width:100%;max-width:340px;margin-bottom:10px}
.bar{background:linear-gradient(90deg,var(--red),var(--amber));height:6px;border-radius:3px;min-width:2px}
.pct{color:var(--red);font-weight:700;white-space:nowrap}
.ref{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ref:last-child{border-bottom:none}
svg text{font-size:10px;fill:var(--faint)}
#errbox{background:#FDF1EE;border:1px solid #E8C4B8;border-radius:var(--r-md);padding:14px 16px;font-size:13px;color:var(--red);margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.footer-links{display:flex;gap:16px;flex-wrap:wrap;margin-top:26px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>数据看板</h1>
      <div class="brandline"></div>
      <div class="sub">访客数据来自自建 Umami（只读分享通道），打开即自动加载，无需登录；Umami 同一会话 30 分钟内不重复计数</div>
    </div>
    <div class="actions">
      <a class="btn ghost" href="/admin/"><svg class="ic"><use href="#i-back"/></svg>返回后台</a>
    </div>
  </div>

  <div id="errbox" class="hide">
    <span id="errmsg"></span>
    <button class="btn small" id="retry">重试</button>
  </div>

  <div id="dash">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px">
      <div class="range" id="rangeBox">
        <button data-v="day">今天</button>
        <button data-v="7d" class="on">近 7 天</button>
        <button data-v="30d">近 30 天</button>
        <button data-v="90d">近 90 天</button>
      </div>
      <button class="btn gray" id="refresh"><svg class="ic"><use href="#i-eye"/></svg>刷新</button>
    </div>

    <div class="sect">
      <h2><svg class="ic"><use href="#i-chart"/></svg>总览</h2>
      <div class="kpis">
        <div class="kpi"><div class="n" id="kPv">–</div><div class="l">浏览量（PV）</div><div class="d">所选时间段内页面被打开的总次数</div></div>
        <div class="kpi"><div class="n" id="kUv">–</div><div class="l">访客数（UV）</div><div class="d">按浏览器去重的人数</div></div>
        <div class="kpi"><div class="n" id="kSs">–</div><div class="l">访问次数</div><div class="d">一个个独立访问会话</div></div>
        <div class="kpi"><div class="n" id="kAvg">–</div><div class="l">平均停留</div><div class="d">每次访问的平均时长</div></div>
      </div>
    </div>

    <div class="sect">
      <h2><svg class="ic"><use href="#i-clock"/></svg>访问趋势</h2>
      <div class="card">
        <div id="chart"><div class="tip">加载中…</div></div>
        <div class="legend"><span><i></i>浏览量</span><span><i class="v2"></i>访客数</span></div>
      </div>
    </div>

    <div class="sect">
      <h2><svg class="ic"><use href="#i-post"/></svg>内容数据</h2>
      <div class="desc">每个页面在所选时间段内的浏览量，输入关键词可筛选</div>
      <div class="card">
        <input id="filter" placeholder="筛选标题或路径…">
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th style="width:42%">页面</th><th style="width:26%">热度</th><th style="width:90px">浏览量</th><th style="width:70px">占比</th></tr></thead>
          <tbody id="pages"></tbody>
        </table>
        </div>
      </div>
    </div>

    <div class="sect">
      <h2><svg class="ic"><use href="#i-cursor"/></svg>访问来源</h2>
      <div class="desc">访客从哪里点进来的，前 10 名；「直接访问」指地址栏输入或收藏夹打开</div>
      <div class="card"><div id="refs"><div class="tip">加载中…</div></div></div>
    </div>

    <div class="footer-links">
      <a href="https://umami.crisxie.top/share/liugeblog" target="_blank">打开分享版看板</a>
      <a href="https://umami.crisxie.top" target="_blank">打开 Umami 管理后台</a>
    </div>
  </div>
</div>

<script src="/admin/icons.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const SITE = 'a9a4a6a0-a722-42b8-9699-b9e78fa69a06';
const SHARE_ID = 'liugeblog';
const BASE = 'https://umami.crisxie.top/api';
const TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai');
let titles = {}, token = '', range = '7d';

function fmtTime(s) {
  s = Math.round(s || 0);
  const m = Math.floor(s / 60);
  return m ? m + ' 分 ' + (s % 60) + ' 秒' : s + ' 秒';
}

function showErr(msg) {
  $('#errbox').classList.remove('hide');
  $('#errmsg').textContent = msg;
}

async function getShareToken() {
  const r = await fetch(BASE + '/share/' + SHARE_ID);
  if (!r.ok) throw new Error('Umami 服务返回 ' + r.status + '，可能暂时不在线');
  token = (await r.json()).token;
}

async function api(path, params, retried) {
  const u = new URL(BASE + path);
  Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { headers: { 'x-umami-share-token': token } });
  if (r.status === 401 && !retried) { await getShareToken(); return api(path, params, true); }
  if (!r.ok) throw new Error('Umami 返回 ' + r.status);
  return r.json();
}

function renderRange() {
  document.querySelectorAll('#rangeBox button').forEach(b => b.classList.toggle('on', b.dataset.v === range));
}
function rangeStart() {
  if (range === 'day') return new Date(new Date().setHours(0, 0, 0, 0)).getTime();
  const days = { '7d': 7, '30d': 30, '90d': 90 }[range];
  return Date.now() - days * 86400000;
}

async function loadTitles() {
  if (Object.keys(titles).length) return;
  try {
    const x = await (await fetch('/sitemap.xml')).text();
    const doc = new DOMParser().parseFromString(x, 'text/xml');
    [...doc.querySelectorAll('url')].forEach(u => {
      const loc = u.querySelector('loc')?.textContent || '';
      const t = u.querySelector('title')?.textContent;
      if (loc && t) titles[new URL(loc).pathname] = t;
    });
  } catch (e) {}
}

function drawChart(pv) {
  const P = Array.isArray(pv.pageviews) ? pv.pageviews : [], V = Array.isArray(pv.visitors) ? pv.visitors : [];
  if (!P.length) { $('#chart').innerHTML = '<div class="tip">这个时间段还没有数据，等有访客后再来看</div>'; return; }
  const W = Math.min(1000, innerWidth - 60), H = 200, pad = 28;
  const max = Math.max(1, ...P.concat(V).map(i => i.y));
  const x = i => pad + i * (W - pad * 2) / Math.max(1, P.length - 1);
  const y = val => H - 20 - (H - 40) * val / max;
  const line = arr => arr.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  const area = line(P) + ` L${x(P.length - 1)},${H - 20} L${x(0)},${H - 20} Z`;
  const labels = [P[0].x.slice(5), P[Math.floor(P.length / 2)].x.slice(5), P[P.length - 1].x.slice(5)];
  $('#chart').innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2543E" stop-opacity=".28"/><stop offset="1" stop-color="#E3A857" stop-opacity=".04"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <path d="${line(P)}" fill="none" stroke="#C2543E" stroke-width="2.5"/>
    <path d="${line(V)}" fill="none" stroke="#8A6E52" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="${pad}" y="${H - 4}">${labels[0]}</text>
    <text x="${W / 2 - 14}" y="${H - 4}">${labels[1]}</text>
    <text x="${W - 46}" y="${H - 4}">${labels[2]}</text>
  </svg>`;
}

let pageRows = [];
function renderPages() {
  const q = ($('#filter').value || '').toLowerCase();
  const rows = pageRows.filter(p => !q || (titles[p.url] || '').toLowerCase().includes(q) || p.url.toLowerCase().includes(q));
  const max = Math.max(1, ...rows.map(r => r.n));
  const total = rows.reduce((s, r) => s + r.n, 0) || 1;
  $('#pages').innerHTML = rows.length ? rows.map(r => {
    const t = titles[r.url] || decodeURIComponent(r.url);
    return `<tr><td><div class="title">${t}</div><div class="url">${r.url}</div></td>
      <td><div class="bar" style="width:${Math.round(r.n / max * 100)}%"></div></td>
      <td class="num"><b>${r.n}</b></td><td class="pct num">${Math.round(r.n / total * 100)}%</td></tr>`;
  }).join('') : '<tr><td colspan="4" class="tip">这个时间段还没有页面数据</td></tr>';
}

async function loadAll() {
  try {
    await loadTitles();
    const startAt = rangeStart(), endAt = Date.now(), unit = range === 'day' ? 'hour' : 'day';
    const [stats, pv, urls, refs] = await Promise.all([
      api(`/websites/${SITE}/stats`, { startAt, endAt }),
      api(`/websites/${SITE}/pageviews`, { startAt, endAt, unit, timezone: TZ }),
      api(`/websites/${SITE}/metrics`, { startAt, endAt, type: 'url' }),
      api(`/websites/${SITE}/metrics`, { startAt, endAt, type: 'referrer' }).catch(() => [])
    ]);
    const v = o => (o && typeof o === 'object' && 'value' in o) ? o.value : (o || 0);
    const st = stats && stats.pageviews ? stats : { pageviews: stats };
    $('#kPv').textContent = v(st.pageviews).toLocaleString();
    $('#kUv').textContent = v(st.visitors || stats.visitors).toLocaleString();
    $('#kSs').textContent = v(st.sessions || stats.sessions).toLocaleString();
    $('#kAvg').textContent = fmtTime((st.totaltime && st.totaltime.value || stats.totaltime || 0) / Math.max(1, v(st.sessions || stats.sessions)));
    drawChart(pv);
    pageRows = (Array.isArray(urls) ? urls : (urls && urls.urls) || []).map(i => ({ url: i.x, n: i.y })).sort((a, b) => b.n - a.n);
    renderPages();
    const rl = Array.isArray(refs) ? refs : [];
    $('#refs').innerHTML = rl.length
      ? rl.slice(0, 10).map(i => `<div class="ref"><span>${(i.x || '').replace(/^https?:\/\//, '').slice(0, 60) || '直接访问'}</span><b class="num">${i.y}</b></div>`).join('')
      : '<div class="tip">这个时间段还没有来源数据</div>';
    $('#errbox').classList.add('hide');
  } catch (e) {
    showErr('加载数据失败：' + e.message);
  }
}

$('#retry').onclick = () => { getShareToken().then(loadAll).catch(e => showErr('重试失败：' + e.message)); };
$('#refresh').onclick = loadAll;
document.querySelectorAll('#rangeBox button').forEach(b => b.onclick = () => { range = b.dataset.v; renderRange(); loadAll(); });
$('#filter').addEventListener('input', renderPages);

renderRange();
getShareToken().then(loadAll).catch(e => showErr('连接 Umami 失败：' + e.message));
</script>
</body>
</html>
