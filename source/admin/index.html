<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>博客后台 | 六哥</title>
<link rel="icon" href="/img/avatar-256.png">
<link rel="stylesheet" href="/admin/admin.css?v=20260902">
</head>
<body>
<div class="wrap">
  <div id="login"></div>

  <div id="app" class="hide">
    <div class="topbar">
      <div>
        <h1>博客后台</h1>
        <div class="brandline"></div>
        <div class="sub">改动保存到 GitHub 仓库后自动构建，约 1–2 分钟后全站生效</div>
      </div>
      <div class="actions">
        <a class="btn ghost" href="/admin/stats.html"><svg class="ic"><use href="#i-chart"/></svg>数据看板</a>
        <button class="btn gray" onclick="logout()"><svg class="ic"><use href="#i-logout"/></svg>退出</button>
      </div>
    </div>

    <div class="sec-label">快捷操作</div>
    <div class="tiles">
      <a class="tile primary" href="/write/">
        <span class="badge"><svg class="ic"><use href="#i-write"/></svg></span>
        <span class="t">写文章</span>
        <span class="d">新建草稿并发布</span>
      </a>
      <a class="tile" href="#edit=essay">
        <span class="badge"><svg class="ic"><use href="#i-feather"/></svg></span>
        <span class="t">发随笔</span>
        <span class="d">一句话动态，即刻上线</span>
      </a>
      <a class="tile" href="#edit=announce">
        <span class="badge"><svg class="ic"><use href="#i-announce"/></svg></span>
        <span class="t">全站公告</span>
        <span class="d">底部公告条文字</span>
      </a>
      <a class="tile" href="#edit=links">
        <span class="badge"><svg class="ic"><use href="#i-link"/></svg></span>
        <span class="t">友情链接</span>
        <span class="d">分组卡片式管理</span>
      </a>
      <a class="tile" href="#edit=works">
        <span class="badge"><svg class="ic"><use href="#i-works"/></svg></span>
        <span class="t">作品页</span>
        <span class="d">分组卡片式管理</span>
      </a>
      <a class="tile" href="#edit=about">
        <span class="badge"><svg class="ic"><use href="#i-about"/></svg></span>
        <span class="t">关于页</span>
        <span class="d">逐模块填写</span>
      </a>
    </div>

    <div class="sec-label">内容</div>
    <div class="card" id="postsCard">
      <h2><svg class="ic"><use href="#i-post"/></svg>文章管理</h2>
      <div id="postsStatus" class="tip">正在从仓库读取文章列表…</div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>标题</th><th style="width:128px">发布时间</th><th style="width:250px">文件</th><th style="width:150px">操作</th></tr></thead>
        <tbody id="postsBody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <!-- 通用编辑器（公告表单 / 友链作品关于的表单+源码双模式） -->
  <div id="editor" class="hide">
    <div class="topbar">
      <div>
        <h1 id="edTitle">编辑</h1>
        <div class="brandline"></div>
        <div class="sub mono" id="edPath"></div>
      </div>
      <div class="actions">
        <button class="btn gray" onclick="closeEditor()"><svg class="ic"><use href="#i-back"/></svg>返回后台</button>
      </div>
    </div>

    <div class="edtabs hide" id="edTabs">
      <button type="button" id="tabForm" class="on">表单填写</button>
      <button type="button" id="tabSrc">YAML 源码</button>
      <span class="tip" style="margin:0 0 0 10px">平时用表单即可，源码模式留给精细调整</span>
    </div>

    <div class="card" id="edAnnounceForm" style="display:none">
      <label class="fl" style="margin-top:0">公告开关</label>
      <label style="font-size:14px"><input type="checkbox" id="anEnabled" style="vertical-align:-2px"> 启用公告（关闭后全站隐藏公告条）</label>
      <label class="fl">公告内容（支持 HTML）</label>
      <input id="anText" style="width:100%" placeholder="公告文字">
      <label class="fl">跳转链接（可选）</label>
      <input id="anLink" style="width:100%" placeholder="https://…">
    </div>

    <div id="edFormWrap"></div>

    <div class="card" id="edTextForm" style="display:none">
      <div class="tip" style="margin:0 0 8px">直接编辑 YAML 源码。格式写错会导致构建失败，改前建议先复制一份备份。</div>
      <textarea id="edText" class="file" rows="24" spellcheck="false"></textarea>
    </div>

    <div class="row">
      <button class="btn" id="edSave"><svg class="ic"><use href="#i-save"/></svg>保存并发布</button>
      <span class="status" id="edStatus"></span>
    </div>
  </div>
</div>

<script src="/admin/secret.js?v=20260902"></script>
<script src="/admin/icons.js?v=20260902"></script>
<script src="/admin/editors.js?v=20260902"></script>
<script src="/admin/admin.js?v=20260902"></script>
<script>
'use strict';

const DATA_FILES = {
  announce: { path: 'source/announce.json',       label: '全站公告', type: 'json' },
  essay:    { path: 'source/_data/brevity.yml',   label: '发随笔',   type: 'form', form: 'essay' },
  links:    { path: 'source/_data/links.yml',     label: '友情链接', type: 'form', form: 'linksite', noun: '友链站点' },
  works:    { path: 'source/_data/works.yml',     label: '作品页',   type: 'form', form: 'linksite', noun: '作品' },
  about:    { path: 'source/_data/about.yml',     label: '关于页',   type: 'form', form: 'about' },
};
let edSha = null, edKey = null, edMode = 'form';

initAuth(() => { loadPosts(); route(); });
window.addEventListener('hashchange', route);

function route() {
  const m = location.hash.match(/#edit=(\w+)/);
  if (m && DATA_FILES[m[1]]) openEditor(m[1]);
  else closeEditor();
}

function closeEditor() {
  edKey = null;
  location.hash = '';
  $('#editor').classList.add('hide');
  $('#app').classList.remove('hide');
}

function edStatus(msg, isErr) {
  const el = $('#edStatus');
  el.textContent = msg;
  el.className = 'status ' + (isErr ? 'err' : 'ok');
}

async function openEditor(key) {
  const conf = DATA_FILES[key];
  if (!conf) return;
  edKey = key;
  edMode = 'form';
  $('#app').classList.add('hide');
  $('#editor').classList.remove('hide');
  $('#edTitle').textContent = conf.label;
  $('#edPath').textContent = conf.path;
  $('#edStatus').textContent = '';
  $('#edStatus').className = 'status';
  $('#edSave').disabled = true;

  const isJson = conf.type === 'json';
  const isForm = conf.type === 'form';
  $('#edAnnounceForm').style.display = isJson ? '' : 'none';
  $('#edTabs').classList.toggle('hide', !isForm);
  $('#tabForm').classList.add('on');
  $('#tabSrc').classList.remove('on');
  $('#edTextForm').style.display = 'none';
  $('#edFormWrap').innerHTML = '';

  try {
    const { text, sha } = await getRepoFile(conf.path);
    edSha = sha;
    if (isJson) {
      const j = JSON.parse(text);
      $('#anEnabled').checked = j.enabled !== false;
      $('#anText').value = j.text || '';
      $('#anLink').value = j.link || '';
    } else if (isForm) {
      renderForm(conf, yamlParse(text));
    }
    $('#edSave').disabled = false;
  } catch (e) {
    edStatus('加载失败：' + e.message, true);
  }
}

function renderForm(conf, obj) {
  const root = $('#edFormWrap');
  if (conf.form === 'about') renderAboutForm(root, obj);
  else if (conf.form === 'essay') renderEssayForm(root, obj);
  else renderLinksiteForm(root, obj, conf.noun);
}

/* 随笔：大输入框 + 最近条目预览；collect 返回「新条目插到最前」的完整列表 */
function renderEssayForm(root, list) {
  list = Array.isArray(list) ? list : [];
  root.innerHTML = `
    <div class="card">
      <label class="fl" style="margin-top:0">随笔内容（支持 emoji 和 HTML，换行会合并为空格）</label>
      <textarea id="esText" rows="4" style="width:100%" placeholder="写点什么…"></textarea>
      <div class="tip"><span id="esCount">0</span> 字 · 发布时自动加时间戳，新随笔排在最前，约 1–2 分钟后出现在「随笔」页</div>
      <div class="sec-label" style="margin-top:14px">最近随笔（只读，改旧内容请切到「YAML 源码」）</div>
      <div id="esRecent"></div>
    </div>`;
  const ta = root.querySelector('#esText');
  const recent = root.querySelector('#esRecent');
  (list || []).slice(0, 5).forEach(it => {
    recent.appendChild(el('<div class="ref"><span>' + esc(String(it.content || '')) + '</span><b class="num">' + esc(String(it.date || '')) + '</b></div>'));
  });
  if (!(list || []).length) recent.appendChild(el('<div class="tip">还没有随笔，发第一条吧</div>'));
  ta.addEventListener('input', () => { root.querySelector('#esCount').textContent = ta.value.length; });
  root.collect = () => {
    const v = ta.value.replace(/\s+/g, ' ').trim();
    if (!v) return list;
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    const stamp = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
    return [{ content: v, date: stamp }].concat(list);
  };
}

function formToYaml(conf) {
  const obj = $('#edFormWrap').collect();
  return { obj, text: conf.form === 'about' ? buildAboutYaml(obj) : yamlDump(obj) };
}

function setTab(mode) {
  const conf = DATA_FILES[edKey];
  if (!conf || conf.type !== 'form') return;
  if (mode === 'src') {
    $('#edText').value = formToYaml(conf).text;
  } else {
    try {
      const obj = yamlParse($('#edText').value);
      renderForm(conf, obj);
    } catch (e) {
      edStatus('源码解析失败：' + e.message + '，已留在源码模式', true);
      return;
    }
  }
  edMode = mode;
  $('#tabForm').classList.toggle('on', mode === 'form');
  $('#tabSrc').classList.toggle('on', mode === 'src');
  $('#edFormWrap').style.display = mode === 'form' ? '' : 'none';
  $('#edTextForm').style.display = mode === 'src' ? '' : 'none';
}
$('#tabForm').onclick = () => setTab('form');
$('#tabSrc').onclick = () => setTab('src');

$('#edSave').onclick = async () => {
  if (!edKey) return;
  const conf = DATA_FILES[edKey];
  let text, commitMsg = '后台修改: ' + conf.label + '（' + conf.path + '）';
  if (conf.type === 'json') {
    text = JSON.stringify({ enabled: $('#anEnabled').checked, text: $('#anText').value.trim(), link: $('#anLink').value.trim() }, null, 2) + '\n';
    try { JSON.parse(text); } catch (e) { return edStatus('内容不是合法 JSON：' + e.message, true); }
  } else if (conf.type === 'form' && edMode === 'form') {
    const r = formToYaml(conf);
    if (!yamlRoundTripOk(r.obj)) return edStatus('自校验未通过（生成的 YAML 无法还原为表单内容），未提交。请检查各输入框内容', true);
    text = r.text;
    if (conf.form === 'essay') {
      const v = $('#esText') ? $('#esText').value.replace(/\s+/g, ' ').trim() : '';
      if (v) commitMsg = '后台发随笔: ' + v.slice(0, 30);
    }
  } else {
    text = $('#edText').value;
    if (!text.trim()) return edStatus('内容为空，已取消', true);
  }
  $('#edSave').disabled = true;
  edStatus('提交中…');
  try {
    const j = await putRepoFile(conf.path, text, commitMsg, edSha);
    edSha = j.content.sha;
    edStatus('已保存，正在自动构建，约 1–2 分钟后上线', false);
    if (conf.form === 'essay' && $('#esText')) $('#esText').value = '';
  } catch (e) {
    edStatus('保存失败：' + e.message + (e.code === 'HTTP' ? '（可能文件刚被别处修改过，点「返回后台」重新进入再试）' : ''), true);
  }
  $('#edSave').disabled = false;
};

/* ---------- 文章列表 ---------- */
async function loadPosts() {
  const st = $('#postsStatus'), body = $('#postsBody');
  try {
    const tree = await listTree();
    const files = tree.filter(t => t.type === 'blob' && /^source\/_posts\/.+\.md$/.test(t.path)).map(t => t.path);
    if (!files.length) { st.textContent = '还没有文章。点上方「写文章」发布第一篇。'; return; }
    const posts = (await pool(files, async p => {
      try {
        const { text } = await getRepoFile(p);
        const { attrs } = parseFrontMatter(text);
        return { path: p, title: attrs.title || p, date: String(attrs.date || '') };
      } catch (e) { return { path: p, title: '(读取失败)', date: '' }; }
    })).sort((a, b) => b.date.localeCompare(a.date));
    st.textContent = '';
    body.innerHTML = posts.map(p => {
      const url = postUrl(p.path, p.date);
      return `<tr>
        <td><div class="title">${esc(p.title)}</div></td>
        <td class="num">${esc(p.date.replace('T', ' ').slice(0, 16))}</td>
        <td><div class="url mono">${esc(p.path.split('/').pop())}</div></td>
        <td class="actions-cell">
          <a class="btn small" href="/write/?file=${encodeURIComponent(p.path)}"><svg class="ic"><use href="#i-write"/></svg>编辑</a>
          ${url ? `<a class="btn small gray" href="${esc(url)}" target="_blank"><svg class="ic"><use href="#i-eye"/></svg>查看</a>` : ''}
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    st.textContent = '加载失败：' + e.message;
    st.style.color = 'var(--red)';
  }
}
</script>
</body>
</html>
