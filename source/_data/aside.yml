- name: schedule
  id: card-widget-schedule
  content_html: |
    <div id="schedule-area-left">
      <div id="schedule-title">距离除夕</div>
      <div id="schedule-days"></div>
      <div id="schedule-date">2027-02-05</div>
    </div>
    <div id="schedule-area-right">
      <div class="schedule-r0">
        <div class="schedule-d0">本年</div>
        <div class="schedule-d1">
          <span id="p_span_year" class="aside-span1"></span>
          <span class="aside-span2">还剩<a></a>天</span>
          <progress max="365" id="pBar_year"></progress>
    </div>
    </div>
      <div class="schedule-r1">
        <div class="schedule-d0">本月</div>
        <div class="schedule-d1">
          <span id="p_span_month" class="aside-span1"></span>
          <span class="aside-span2">还剩<a></a>天</span>
          <progress max="30" id="pBar_month"></progress>
        </div>
      </div>
      <div class="schedule-r2">
        <div class="schedule-d0">本周</div>
        <div class="schedule-d1">
          <span id="p_span_week" class="aside-span1"></span>
          <span class="aside-span2">还剩<a></a>天</span>
          <progress max="7" id="pBar_week"></progress>
        </div>
      </div>
    </div>

- name: calendar
  id: card-widget-calendar
  content_html: |
    <div id="calendar-area-left">
      <div id="calendar-week"></div>
      <div id="calendar-date" style="font-size: 48px;"></div>
      <div id="calendar-solar"></div>
      <div id="calendar-lunar"></div>
    </div>
    <div id="calendar-area-right">
      <div id="calendar-main">
      </div>
    </div>

- name: ads-slot
  id: card-widget-ads
  icon: fas fa-bullhorn
  title: 广告位招租
  content_html: |
    <div style="text-align:center;padding:6px 0 2px">
      <div style="font-size:13px;color:#8a7f6f;line-height:1.8">侧栏 / 文章页广告位<br>虚位以待，支持图文与跳转链接</div>
      <a href="javascript:void(0)" onclick="var t='2645939663',b=this,b0=b.textContent;b.textContent='✅ 已复制：'+t;var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);setTimeout(function(){b.textContent=b0},2000);return false" style="display:inline-block;margin-top:10px;padding:8px 18px;border-radius:10px;background:linear-gradient(90deg,#C2543E,#E3A857);color:#fff;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer">联系站长：点击复制 QQ</a>
      <div style="font-size:11px;color:#b0a499;margin-top:6px">QQ：2645939663（点击按钮自动复制）</div>
    </div>
